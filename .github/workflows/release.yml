name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported Ubuntu, so the binaries run on any glibc 2.35 or newer.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Archive
        run: |
          name="ferrited-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir "$name" dist
          cp "target/${{ matrix.target }}/release/ferrited" README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar -czf "dist/$name.tar.gz" "$name"
      - name: Install packaging tools
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Build .deb and .rpm
        if: runner.os == 'Linux'
        run: scripts/package.sh ${{ matrix.target }} | xargs -I{} cp {} dist/
      - name: Checksums
        working-directory: dist
        run: |
          for file in *; do shasum -a 256 "$file" > "$file.sha256"; done
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # A draft, so the notes and files can be checked before the release is published.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat *.sha256 > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "ferrited ${GITHUB_REF_NAME#v}" --generate-notes \
            ferrited-*.tar.gz ferrited_*.deb ferrited-*.rpm SHA256SUMS
